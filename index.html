<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Login Ujian Kimia</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      height: 55vh;
      min-height: 360px;
      max-height: 600px;
      margin: auto;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    #hasil {
      max-width: 500px;
      margin: 15px auto 0;
      padding: 18px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
    }

    .menunggu {
      color: #777;
    }

    .berhasil {
      color: #168a3a;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <h1>LOGIN UJIAN KIMIA</h1>

  <div class="subtitle">
    Arahkan QR siswa ke kamera
  </div>

  <div id="reader"></div>

  <div id="hasil">

    <div class="menunggu">
      MENUNGGU SCAN
    </div>

  </div>


<script>

  /*
   * ==================================================
   * SCANNER
   * Mengikuti pola Index ABSENSI yang sudah berhasil
   * ==================================================
   */

  let scanner = null;

  let sedangMemproses = false;


  /*
   * ==================================================
   * MULAI SCANNER
   * ==================================================
   */

  function mulaiScanner() {

    scanner = new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },


      function(decodedText) {

        if (sedangMemproses) {
          return;
        }

        sedangMemproses = true;


        tampilkanHasil(decodedText);

      },


      function(errorMessage) {

        /*
         * Tidak melakukan apa-apa.
         *
         * Scanner tetap aktif mencari QR.
         */

      }

    )

    .then(function() {

      document.getElementById("hasil").innerHTML = `

        <div class="menunggu">
          MENUNGGU SCAN
        </div>

      `;

    })

    .catch(function(error) {

      console.error(error);

      tampilkanError(
        "KAMERA TIDAK DAPAT DIAKTIFKAN."
      );

    });

  }


  /*
   * ==================================================
   * HASIL SCAN
   * ==================================================
   */

  function tampilkanHasil(qrId) {

    document.getElementById("hasil").innerHTML = `

      <div class="menunggu">
        MEMERIKSA IDENTITAS...
      </div>

    `;


    /*
     * ==================================================
     * API APPS SCRIPT
     * ==================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwxeW6ZSki-s_3m04SUolyJ_Q1zEbGTgNNDDE4J4GVEV-gAyvJaspzzcLRhCFw5OE1yow/exec";


    /*
     * Membuat callback unik
     */

    const namaCallback =
  "verifikasiCallback";

    /*
     * Fungsi menerima hasil dari Apps Script
     */

    window[namaCallback] = function(data) {

      try {

        if (data.berhasil &&
            data.status === "SISWA_DITEMUKAN") {

          document.getElementById("hasil").innerHTML = `

            <div class="berhasil">
              ● IDENTITAS DITEMUKAN
            </div>

            <br>

            <strong>
              ${data.nama}
            </strong>

            <br><br>

            NIS : ${data.nis}

            <br>

            KELAS : ${data.kelas}

          `;

        }

        else {

          document.getElementById("hasil").innerHTML = `

            <div class="error">
              ● IDENTITAS TIDAK DITEMUKAN
            </div>

            <br>

            ID:
            <strong>
              ${qrId}
            </strong>

          `;

        }

      }

      finally {

        delete window[namaCallback];

      }


      /*
       * Siapkan scanner kembali
       */

      setTimeout(function() {

        sedangMemproses = false;

        document.getElementById("hasil").innerHTML = `

          <div class="menunggu">
            MENUNGGU SCAN
          </div>

        `;

      }, 4000);

    };


    /*
     * ==================================================
     * URL API VERIFIKASI
     * ==================================================
     */

    const url =
      API_URL +
      "?mode=verifikasi" +
      "&qr=" +
      encodeURIComponent(qrId) +
      "&callback=" +
      namaCallback;


    /*
     * ==================================================
     * KIRIM REQUEST JSONP
     * ==================================================
     */

    const script =
      document.createElement("script");


    script.src = url;


    script.onerror = function() {

      document.getElementById("hasil").innerHTML = `

        <div class="error">
          ● GAGAL MENGHUBUNGI SERVER
        </div>

      `;

      delete window[namaCallback];

      setTimeout(function() {

        sedangMemproses = false;

        document.getElementById("hasil").innerHTML = `

          <div class="menunggu">
            MENUNGGU SCAN
          </div>

        `;

      }, 3000);

    };


    document.body.appendChild(script);


    /*
     * Hapus script setelah selesai
     */

    setTimeout(function() {

      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }

    }, 10000);

  }


  /*
   * ==================================================
   * ERROR
   * ==================================================
   */

  function tampilkanError(pesan) {

    document.getElementById("hasil").innerHTML = `

      <div class="error">
        ● ${pesan}
      </div>

    `;

  }


  /*
   * ==================================================
   * MULAI
   * ==================================================
   */

  window.onload = function() {

    mulaiScanner();

  };

</script>


</body>

</html>
